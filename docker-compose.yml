services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: northstar
      POSTGRES_USER: northstar
      POSTGRES_PASSWORD: northstar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northstar -d northstar"]
      interval: 2s
      timeout: 3s
      retries: 20

  api-1:
    build:
      context: .
    environment:
      PORT: 3000
      INSTANCE_NAME: api-1
      DATABASE_URL: postgres://northstar:northstar@postgres:5432/northstar
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/health'); if(!r.ok) process.exit(1)"]
      interval: 3s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  api-2:
    build:
      context: .
    environment:
      PORT: 3000
      INSTANCE_NAME: api-2
      DATABASE_URL: postgres://northstar:northstar@postgres:5432/northstar
    ports:
      - "3002:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3000/health'); if(!r.ok) process.exit(1)"]
      interval: 3s
      timeout: 2s
      retries: 10
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
